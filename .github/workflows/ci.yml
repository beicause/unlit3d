name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"
  ANDROID_NDK_VERSION: 29.0.14206865
  CACHE_SUFFIX: e # cache busting

jobs:
  lint:
    runs-on: ubuntu-latest
    # runtime is normally 10 seconds
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check for typos
        uses: crate-ci/typos@v1.50.1

      - name: Install tombi
        uses: tombi-toml/setup-tombi@v1.4

      - name: Check for tombi
        run: tombi lint --error-on-warnings; tombi format --check --diff

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal

      - name: Check rust formatting
        run: cargo fmt --all -- --check

  build:
    name: Build ${{matrix.os}}
    # runtime is normally 2 minutes. The install of nextest is what sets the
    # ceiling: when the release lookup is rate-limited it falls back to a source
    # build, which is several hundred crates and takes minutes of its own, so
    # the timeout leaves room for that run rather than assuming the prebuilt
    # binary is always there.
    timeout-minutes: 20
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # The snapshots live in the asset submodule. Without it the
      # `tests/snapshots` symlinks dangle, and a comparison against a missing
      # snapshot stores the frame and passes instead of comparing.
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy

      - name: Install Mesa
        # Linux runners have no GPU: lavapipe is the software Vulkan
        # implementation the GPU tests render through. macOS has Metal and
        # Windows has DX12, so neither needs anything installed.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # Without `unlit` this crate compiles down to its general facilities,
      # so the built-in pipeline stays something a caller could have written.
      - name: Clippy (no features)
        run: cargo clippy -p unlit_wgpu --no-default-features --all-targets -- -Dwarnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

      - name: Build ${{matrix.os}}
        run: cargo build --workspace --all-targets

      # `cargo xtask test` runs nextest over the unit and integration tests,
      # then `cargo test --doc` for the doctests nextest does not cover. The
      # same command a contributor runs, so CI cannot drift from it.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      # The install is the one step a failure in which can take the test step
      # with it: without nextest there is nothing for `cargo xtask test` to run,
      # so that step's implicit `success()` skips it. The doc build and the
      # snapshot comparison below are independent of it and carry on.
      #
      # `GITHUB_TOKEN` keeps cargo-binstall on its prebuilt-binary path: without
      # it the release lookup is unauthenticated and can be rate-limited into a
      # `403`, which sends cargo-binstall to its next source for the crate.
      #
      # That next source is a source build, and `--locked` is what lets it
      # succeed: nextest refuses to be installed without a lockfile
      # (`locked-tripwire` fails the build on purpose), so the flag is passed
      # through to the `cargo install` cargo-binstall falls back to.
      - name: Install cargo-nextest
        run: cargo binstall --no-confirm --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test ${{matrix.os}}
        run: cargo xtask test

      # `!cancelled()` rather than the implicit `success()`: the checks below
      # are independent of the ones above, so a failure in any of them still
      # gets to report its own result in the same run. Only a cancelled run
      # stops early, since there is nothing left to report.
      - name: Doc
        if: ${{ !cancelled() }}
        run: cargo doc --workspace --no-deps --document-private-items --keep-going
        env:
          RUSTDOCFLAGS: -D warnings

      # The example renders every scene headlessly and compares each frame
      # against its stored snapshot, so a rendering regression fails here
      # rather than passing unnoticed. This is the check that replaced the
      # snapshot tests that used to live in `crates/unlit3d/tests`; the
      # scenes and their snapshots are described in `unlit3d_examples`.
      # The device is the default tier — the WebGPU baseline's limits, which
      # every implementation guarantees. `--update` regenerates the snapshots;
      # review their diff before committing it.
      #
      # The snapshots were captured on one GPU stack (Linux's lavapipe), and
      # another driver's rounding is enough to put a scene below the threshold
      # without anything being wrong. A mismatch therefore writes the frame it
      # scored under `target/`, and the step after this one uploads those
      # frames, so a platform difference can be looked at instead of guessed at
      # from a score. The upload waits on this step's own outcome rather than on
      # the job's, so a failure elsewhere — a tool that would not install, say —
      # does not turn into an upload of frames this step never wrote.
      - name: Compare the example's scenes against their snapshots
        id: snapshots
        if: ${{ !cancelled() }}
        run: >
          cargo run -p unlit3d_examples --features snapshot
          -- --headless --scene all
          --mismatch-dir target/snapshot-mismatches

      - name: Upload the mismatched frames
        if: ${{ steps.snapshots.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: snapshot-mismatches-${{ matrix.os }}
          path: target/snapshot-mismatches
          if-no-files-found: ignore

      # The same scenes again, with every headless device narrowed to what
      # WebGL2 offers: no storage buffers, no `base_vertex`, none of the other
      # downlevel capabilities. This is what draws the shader's arrays from
      # textures and bakes a mesh's pool offset into its indices, so a scene
      # that only works on the storage path fails here. It is a rendering
      # comparison rather than a capability probe: the frames have to come back
      # the same as the stored ones. The mismatches go to a directory of their
      # own so a run that fails both steps keeps the two tiers apart.
      #
      # `!cancelled()` rather than the implicit `success()`: a mismatch in the
      # default tier must not hide what the WebGL2 tier would have reported, so
      # one run shows every scene that fails under either tier. A cancelled run
      # is the exception, since there is nothing left to report.
      - name: Compare the example's scenes under the WebGL2 device tier
        id: snapshots-webgl2
        if: ${{ !cancelled() }}
        run: >
          cargo run -p unlit3d_examples --features snapshot
          -- --headless --scene all
          --mismatch-dir target/snapshot-mismatches-webgl2
        env:
          UNLIT3D_DEVICE_TIER: webgl2

      - name: Upload the mismatched frames under the WebGL2 device tier
        if: ${{ steps.snapshots-webgl2.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: snapshot-mismatches-webgl2-${{ matrix.os }}
          path: target/snapshot-mismatches-webgl2
          if-no-files-found: ignore

  build-wasm:
    name: Build wasm
    # runtime is normally 30 seconds
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy
          rustup target add wasm32-unknown-unknown

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-wasm-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -Dwarnings

      - name: Build wasm
        # Not `--all-targets`: the example crate is a `cdylib` as well as a
        # binary, and on `wasm32-unknown-unknown` both want to write
        # `unlit3d_examples.wasm`, which cargo warns about as an output
        # filename collision. The binary is what a browser runs; the library
        # exists for Android, so only the targets that never produce it are
        # built here.
        #
        # `xtask` is excluded because it is a host-only task runner: its HTTP
        # server reaches `async-io` and so `errno`, which does not build for
        # this target. Nothing in the browser or the APK depends on it.
        run: >
          cargo build --workspace --exclude xtask
          --target wasm32-unknown-unknown --bins --tests --benches --examples

  build-android:
    name: Build android
    # A Gradle build downloads its own distribution and dependencies, and the
    # Rust cross-build walks the whole dependency tree; the caches make the
    # runs after the first much shorter.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal
          rustup target add aarch64-linux-android

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-android-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # AGP 9 requires JDK 17 or newer, and the runner image's default is not
      # guaranteed to be one the wrapper accepts.
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle user home — the distribution and the dependency
      # cache — through `actions/cache`, rather than the proprietary provider
      # this action defaults to.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      # The NDK is not installed here: the runner image already carries the
      # version this project pins, and `cargo ndk` finds it by itself.
      - name: Install cargo-ndk
        run: cargo binstall --no-confirm cargo-ndk

      # One command for both halves: `cargo ndk` builds the example's shared
      # library into the APK's `jniLibs` directory, then the task runs the
      # Gradle wrapper on `android/`. A debug APK is what is published because
      # it is the one the build signs: an unsigned release APK cannot be
      # installed without a signing step of its own.
      #
      # `ANDROID_HOME` comes from the runner image rather than this workflow's
      # `env`, so it is expanded by the shell: the `env` context only holds
      # variables a workflow sets, not the ones the runner inherits.
      - name: Build the APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          cargo xtask build-android

      - name: Upload the APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unlit3d-examples-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
