name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"
  ANDROID_NDK_VERSION: 29.0.14206865
  CACHE_SUFFIX: e # cache busting

jobs:
  lint:
    runs-on: ubuntu-latest
    # runtime is normally 10 seconds
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check for typos
        uses: crate-ci/typos@v1.50.1

      - name: Install tombi
        uses: tombi-toml/setup-tombi@v1.4

      - name: Check for tombi
        run: tombi lint --error-on-warnings; tombi format --check --diff

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal

      - name: Check rust formatting
        run: cargo fmt --all -- --check

  build:
    name: Build ${{matrix.os}}
    # runtime is normally 2 minutes. The install of nextest is what sets the
    # ceiling: when the release lookup is rate-limited it falls back to a source
    # build, which is several hundred crates and takes minutes of its own, so
    # the timeout leaves room for that run rather than assuming the prebuilt
    # binary is always there.
    timeout-minutes: 20
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      # The snapshots live in the asset submodule. `.gitmodules` marks it
      # `update = none`, so a project that depends on this one through git does
      # not fetch snapshots it never compares against; the tests here do, and
      # `--checkout` is what forces past that setting. Without it the
      # `tests/snapshots` symlinks dangle, and a comparison against a missing
      # snapshot stores the frame and passes instead of comparing.
      - name: Check out the asset submodule
        run: git submodule update --init --checkout

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy

      - name: Install Mesa
        # Linux runners have no GPU: lavapipe is the software Vulkan
        # implementation the GPU tests render through. macOS has Metal and
        # Windows has DX12, so neither needs anything installed.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # Without `unlit` this crate compiles down to its general facilities,
      # so the built-in pipeline stays something a caller could have written.
      - name: Clippy (no features)
        run: cargo clippy -p unlit_wgpu --no-default-features --all-targets -- -Dwarnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

      - name: Build ${{matrix.os}}
        id: build
        run: cargo build --workspace --all-targets

      # `cargo xtask test` runs nextest over the unit and integration tests,
      # then `cargo test --doc` for the doctests nextest does not cover. The
      # same command a contributor runs, so CI cannot drift from it.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      # The install is the one step a failure in which can take the test step
      # with it: without nextest there is nothing for `cargo xtask test` to run,
      # so that step's implicit `success()` skips it. The doc build below is
      # independent of it and carries on.
      #
      # `GITHUB_TOKEN` keeps cargo-binstall on its prebuilt-binary path: without
      # it the release lookup is unauthenticated and can be rate-limited into a
      # `403`, which sends cargo-binstall to its next source for the crate.
      #
      # That next source is a source build, and `--locked` is what lets it
      # succeed: nextest refuses to be installed without a lockfile
      # (`locked-tripwire` fails the build on purpose), so the flag is passed
      # through to the `cargo install` cargo-binstall falls back to.
      - name: Install cargo-nextest
        run: cargo binstall --no-confirm --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The suite includes the example's scene snapshots, so this one step is
      # what verifies the scenes' rendering — twice, once per device tier, since
      # `cargo xtask test` runs the second pass with `UNLIT3D_DEVICE_TIER=webgl2`.
      # The same tests then run again in a real browser under `build-wasm`,
      # which is a WebGL2 implementation the device tiers only imitate.
      - name: Test ${{matrix.os}}
        id: test
        run: cargo xtask test

      # A frame that fails its snapshot comparison is written rather than only
      # scored, so a mismatch arrives as an image to look at instead of a number
      # to guess from — the stored frames come from one GPU stack, and another
      # driver's rounding is enough to put a scene below the bar with nothing
      # wrong. `cargo xtask test` gives each device tier a directory of its own,
      # so a run that fails under both keeps them apart.
      - name: Upload the mismatched snapshot frames
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: snapshot-mismatches-${{ matrix.os }}
          path: |
            target/snapshot-mismatches
            target/snapshot-mismatches-webgl2
          if-no-files-found: ignore

      # What the checks below need is a workspace that compiles, which is what
      # `steps.build` records — not a green run of everything above them. A
      # nextest that would not install is no reason to drop them, while a failed
      # clippy or build is one: they would only fail again on the same code, so
      # they wait on that step and on nothing else. `!cancelled()` keeps a
      # cancelled run from starting them at all.
      - name: Doc
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo doc --workspace --no-deps --document-private-items --keep-going
        env:
          RUSTDOCFLAGS: -D warnings

  build-wasm:
    name: Build and test wasm
    # The runner installs a browser, builds the workspace and every wasm test
    # binary, and then drives one browser page per test. Software WebGL2 is what
    # makes the last part slow rather than the build.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The snapshots live in the asset submodule, and the wasm test binaries
      # embed them at compile time. Without it the build fails on the
      # `include_bytes!` rather than comparing against a missing frame. The
      # `--checkout` is what gets past the submodule's `update = none`, as in
      # the build job above.
      - name: Check out the asset submodule
        run: git submodule update --init --checkout

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy
          rustup target add wasm32-unknown-unknown

      # One cache for the whole job: its two builds share this key, and the
      # features they differ in are the only reason there are two.
      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-wasm-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # Host-only, so it compiles the workspace for the machine the task runner
      # itself runs on rather than for wasm.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -Dwarnings

      # `cargo xtask test-wasm` checks this CLI against the `wasm-bindgen` the
      # workspace resolves, so the version is taken from the workspace rather
      # than pinned here — a bump then needs no edit to this file.
      - name: Install wasm-bindgen
        run: |
          version=$(cargo metadata --format-version 1 --all-features \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version="$version"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Builds the workspace for wasm, bindgens each test binary, and runs them
      # in a browser. The runner's JS dependencies and a browser are installed
      # by the subcommand before it starts anything.
      - name: Test wasm
        id: test-wasm
        run: cargo xtask test-wasm

      # The page has no filesystem, so a frame that fails a comparison is
      # encoded in the browser and handed to the Node runner, which writes it
      # under the wasm pass's own directory. A real WebGL2 rasterizer is a
      # different implementation from any device tier, so this is where a frame
      # is most likely to differ for reasons that are not a regression.
      - name: Upload the mismatched snapshot frames
        if: ${{ failure() && steps.test-wasm.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: snapshot-mismatches-wasm
          path: target/snapshot-mismatches-wasm
          if-no-files-found: ignore

  build-android:
    name: Build android
    # A Gradle build downloads its own distribution and dependencies, and the
    # Rust cross-build walks the whole dependency tree; the caches make the
    # runs after the first much shorter.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The example embeds the glTF assets with `include_bytes!`, and linting the
      # workspace compiles it, so the cross-build needs them as much as the host
      # one does. `.gitmodules` marks the submodule `update = none`, so
      # `--checkout` is what gets past that setting; without it the step below
      # fails on the missing assets rather than on anything this job is about.
      - name: Check out the asset submodule
        run: git submodule update --init --checkout

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy
          rustup target add aarch64-linux-android

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-android-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # AGP 9 requires JDK 17 or newer, and the runner image's default is not
      # guaranteed to be one the wrapper accepts.
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle user home — the distribution and the dependency
      # cache — through `actions/cache`, rather than the proprietary provider
      # this action defaults to.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      # The NDK is not installed here: the runner image already carries the
      # version this project pins, and `cargo ndk` finds it by itself.
      - name: Install cargo-ndk
        run: cargo binstall --no-confirm cargo-ndk

      # The `build` job lints the workspace for the host, which never compiles
      # the code behind `cfg(target_os = "android")` — the entry point among it.
      # Linting the target the APK ships is what covers that half, and it runs
      # before the cross-build because it is the same compilation: a lint error
      # here is a build error one step later, reported with a line.
      - name: Clippy (Android target)
        run: cargo ndk -t arm64-v8a -P 26 clippy --workspace --all-targets --all-features -- -D warnings

      # One command for both halves: `cargo ndk` builds the example's shared
      # library into the APK's `jniLibs` directory, then the task runs the
      # Gradle wrapper on `android/`. A debug APK is what is published because
      # it is the one the build signs: an unsigned release APK cannot be
      # installed without a signing step of its own.
      #
      # `ANDROID_HOME` comes from the runner image rather than this workflow's
      # `env`, so it is expanded by the shell: the `env` context only holds
      # variables a workflow sets, not the ones the runner inherits.
      - name: Build the APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          cargo xtask build-android

      - name: Upload the APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unlit3d-examples-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
