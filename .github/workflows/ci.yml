name: Rust CI

# The light tier: the checks a contributor can act on, which is what a branch
# needs before it is reviewed. It runs on every pull request and on every push to
# a branch other than `main`, so a branch pushed without a pull request is
# checked just the same — the pull request adds the review, not the checks. Both
# events see the same commit, which is what the concurrency group below is keyed
# to keep apart.
#
# Which tier a run gets is decided by the workflow that starts it, and every job
# here runs to completion: this file is the light tier, and `ci-main.yml` is the
# full one. It calls this workflow with `full` — which is what widens the `build`
# matrix to macOS and Windows — and adds what only a release needs: the browser's
# wasm suite and the APK. Keeping the shared jobs here is what stops the two
# tiers from being two copies of the same steps.
on:
  workflow_dispatch:
  push:
    # Every branch but `main`, which `ci-main.yml` runs instead.
    branches: ["**", "!main"]
  # Every pull request, whatever it targets: a change opened against a branch
  # other than `main` is no more reviewed than any other.
  pull_request:
  # The full tier, calling in.
  workflow_call:
    inputs:
      full:
        description: Run the shared jobs on every platform, not on Linux alone.
        type: boolean
        default: false

concurrency:
  # Keyed by the branch rather than by the ref, so that a push to a branch and
  # the pull request opened from it share one slot. Without this the light tier
  # would run twice for the same commit — once for the push, once for the pull
  # request. `cancel-in-progress` then leaves the later of the two standing.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"
  ANDROID_NDK_VERSION: 29.0.14206865
  CACHE_SUFFIX: e # cache busting

jobs:
  lint:
    runs-on: ubuntu-latest
    # runtime is normally 10 seconds
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check for typos
        uses: crate-ci/typos@v1.50.2

      - name: Install tombi
        uses: tombi-toml/setup-tombi@v1.4

      - name: Check for tombi
        run: tombi lint --error-on-warnings; tombi format --check --diff

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal

      - name: Check rust formatting
        run: cargo fmt --all -- --check

  build:
    name: Build ${{matrix.os}}
    # Measured on the slowest runner, Windows, which spends about ten minutes
    # building the workspace and five more on clippy: a cold cache there puts
    # the whole job near twenty minutes before the tests even start, and the
    # build, the tests and the doc build all still have to run. The install of
    # nextest is the other thing that sets the ceiling: when the release lookup
    # is rate-limited it falls back to a source build, which is several hundred
    # crates and takes minutes of its own, so the timeout leaves room for that
    # run rather than assuming the prebuilt binary is always there.
    timeout-minutes: 35
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        # The light tier takes the Linux leg alone. It is the one that runs the
        # linting, the build, the whole test suite and the docs, it is the one
        # every contributor can reproduce locally, and its cache is what makes
        # a second push cheap. macOS and Windows prove portability instead:
        # nothing in a change breaks them without the Linux leg failing first,
        # and the queue that consumes the result only needs them before a
        # release, which a merge to `main` is the last chance for.
        # `ci-main.yml` passes `full`, which is what asks for them.
        os: ${{ fromJSON(inputs.full && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v7.0.1

      # The snapshots live in the asset submodule. `.gitmodules` marks it
      # `update = none`, so a project that depends on this one through git does
      # not fetch snapshots it never compares against; the tests here do, and
      # `--checkout` is what forces past that setting. Without it the
      # `tests/snapshots` symlinks dangle, and a comparison against a missing
      # snapshot stores the frame and passes instead of comparing.
      - name: Check out the asset submodule
        run: git submodule update --init --checkout

      # The demo's soundfont is a 14 MB asset the repository keeps out of
      # version control, and the example's build reads it from `assets/`.
      # Fetching it here is what lets the audio snapshot test run for real
      # instead of skipping: the test step below sets
      # `UNLIT3D_REQUIRE_SOUNDFONT`, so a checkout that silently stopped
      # exercising the mix fails rather than passing.
      - name: Fetch the demo soundfont
        # One line: the default shell on Windows is PowerShell, which does not
        # continue a command on a trailing backslash.
        run: |
          mkdir -p assets
          gh api -H "Accept: application/vnd.github.raw" repos/beicause/soundfont/contents/FluidR3Mono_GM.sf3 > assets/FluidR3Mono_GM.sf3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy

      - name: Install Mesa
        # Linux runners have no GPU: lavapipe is the software Vulkan
        # implementation the GPU tests render through. macOS has Metal and
        # Windows has DX12, so neither needs anything installed.
        #
        # libasound2-dev is the ALSA headers cpal's Linux host links through,
        # which any host build of unlit3dx needs.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers libasound2-dev

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false
          cache-on-failure: true

      # Without `unlit` this crate compiles down to its general facilities,
      # so the built-in pipeline stays something a caller could have written.
      - name: Clippy (no features)
        run: cargo clippy -p unlit_wgpu --no-default-features --all-targets -- -Dwarnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

      - name: Build ${{matrix.os}}
        id: build
        run: cargo build --workspace --all-targets

      # `cargo xtask test` runs nextest over the unit and integration tests,
      # then `cargo test --doc` for the doctests nextest does not cover. The
      # same command a contributor runs, so CI cannot drift from it.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      # The install is the one step a failure in which can take the test step
      # with it: without nextest there is nothing for `cargo xtask test` to run,
      # so that step's implicit `success()` skips it. The doc build below is
      # independent of it and carries on.
      #
      # `GITHUB_TOKEN` keeps cargo-binstall on its prebuilt-binary path: without
      # it the release lookup is unauthenticated and can be rate-limited into a
      # `403`, which sends cargo-binstall to its next source for the crate.
      #
      # That next source is a source build, and `--locked` is what lets it
      # succeed: nextest refuses to be installed without a lockfile
      # (`locked-tripwire` fails the build on purpose), so the flag is passed
      # through to the `cargo install` cargo-binstall falls back to.
      - name: Install cargo-nextest
        run: cargo binstall --no-confirm --locked cargo-nextest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The suite includes the example's scene snapshots, so this one step is
      # what verifies the scenes' rendering — twice, once per device tier, since
      # `cargo xtask test` runs the second pass with `UNLIT3D_DEVICE_TIER=webgl2`.
      # The same tests then run again in a real browser under `build-wasm`,
      # which is a WebGL2 implementation the device tiers only imitate.
      - name: Test ${{matrix.os}}
        id: test
        run: cargo xtask test
        env:
          # The soundfont was fetched above, so the audio snapshot test has
          # what it needs: requiring it here is what turns a checkout that
          # lost the asset from a silent skip into a failure.
          UNLIT3D_REQUIRE_SOUNDFONT: "1"

      # A frame that fails its snapshot comparison is written rather than only
      # scored, so a mismatch arrives as an image to look at instead of a number
      # to guess from — the stored frames come from one GPU stack, and another
      # driver's rounding is enough to put a scene below the bar with nothing
      # wrong. `cargo xtask test` gives each device tier a directory of its own,
      # so a run that fails under both keeps them apart.
      - name: Upload the mismatched snapshot frames
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: snapshot-mismatches-${{ matrix.os }}
          path: |
            target/snapshot-mismatches
            target/snapshot-mismatches-webgl2
          if-no-files-found: ignore

      # What the checks below need is a workspace that compiles, which is what
      # `steps.build` records — not a green run of everything above them. A
      # nextest that would not install is no reason to drop them, while a failed
      # clippy or build is one: they would only fail again on the same code, so
      # they wait on that step and on nothing else. `!cancelled()` keeps a
      # cancelled run from starting them at all.
      - name: Doc
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo doc --workspace --no-deps --document-private-items --keep-going
        env:
          RUSTDOCFLAGS: -D warnings

  # What the light tier checks about the web build is that it lints for the
  # target: the `wasm32` build of the workspace and the `wasm32` build of every
  # test binary. `build-wasm` in `ci-main.yml` goes on to bindgen the test
  # binaries and drive a browser, which is most of its cost, and lints those same
  # two builds on the way there — so `main` takes that job and skips this one.
  # The suites are the same files either way, so a change that breaks one still
  # fails here, with the browser's own answer waiting on `main`.
  check-wasm:
    name: Check wasm
    # Lints the workspace for the target, which is a smaller build than the host
    # one, twice over — without a link and without a browser.
    if: ${{ !inputs.full }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The snapshot tests embed their baselines with `include_bytes!`, which
      # is a compile error until the submodule is there: without it the check
      # fails on a missing file rather than on the change. The `--checkout` is
      # what gets past the submodule's `update = none`, as in the `build` job.
      - name: Check out the asset submodule
        run: git submodule update --init --checkout

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy
          rustup target add wasm32-unknown-unknown

      # The cache is the one `build-wasm` keeps, not a key of this job's own:
      # `shared-key` is what ties two jobs to it, where `key` would let the
      # action append this job's name and leave the save behind here unseen by
      # the browser run. So a pull request warms the tree the merge to `main`
      # restores, and that run starts from a target directory which has already
      # met this target instead of from nothing.
      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-wasm-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false
          cache-on-failure: true

      # The two builds `cargo xtask test-wasm` makes, as a lint:
      #
      # - The workspace under the default features, which is what the browser
      #   example and the Android library ship. `xtask` is excluded because it
      #   is a host-only task runner whose HTTP server reaches `async-io` and so
      #   `errno`, neither of which builds for this target.
      # - The test binaries of the packages that can run in a browser, under
      #   `--all-features`, which is how the browser run builds them.
      #
      # Both run under the default profile rather than `wasm-dev`: nothing here
      # is linked or run, so the optimization level only costs time, and the
      # browser job still compiles the same sources with the profile it runs in.
      - name: Lint the wasm workspace
        run: |
          cargo clippy --workspace --exclude xtask \
            --target wasm32-unknown-unknown \
            --bins --tests --benches --examples -- -D warnings
          cargo clippy \
            -p unlit_wgpu -p unlit3d -p unlit3d_examples -p unlit3dx_examples \
            --tests --all-features --target wasm32-unknown-unknown -- -D warnings

  check-android:
    name: Check android
    # The cross-lint is one compilation of the workspace, with the NDK the
    # runner image already carries. `build-android` in `ci-main.yml` runs the
    # same `cargo ndk ... clippy` before it builds the APK, so `main` takes that
    # job and skips this one.
    if: ${{ !inputs.full }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The examples embed the glTF assets with `include_bytes!`, and this
      # compiles them, so the submodule is needed here as much as it is in the
      # APK build. `--checkout` gets past its `update = none`.
      - name: Check out the asset submodule
        run: git submodule update --init --checkout

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy
          rustup target add aarch64-linux-android

      # The image carries more than one NDK and points `ANDROID_NDK_HOME` at its
      # default, which is not the version this project pins. `build-android` in
      # `ci-main.yml` points at the pinned one, and the two have to agree for the
      # cache they share to be worth sharing: a different NDK is a different
      # clang, and every C dependency is rebuilt for it. `ANDROID_HOME` is
      # inherited from the runner rather than set by this workflow, so the path
      # is assembled in the shell.
      - name: Point the NDK at the pinned version
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      # As in `check-wasm`: the same cache `build-android` keeps, so the
      # cross-build behind a merge finds the dependency tree this lint already
      # compiled for the target.
      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-android-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false
          cache-on-failure: true

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      # The NDK is not installed here: the runner image already carries the
      # version this project pins, and the step above points `cargo ndk` at it.
      #
      # `--strategies` is spelled out because cargo-ndk's own manifest disables
      # two of the defaults, the source build among them, which leaves the
      # prebuilt download as its only option — and a release lookup the API
      # rate-limits into a `403` then has nowhere to fall back to.
      # `GITHUB_TOKEN` keeps that lookup authenticated.
      - name: Install cargo-ndk
        run: cargo binstall --no-confirm --strategies crate-meta-data,quick-install,compile cargo-ndk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clippy (Android target)
        run: cargo ndk -t arm64-v8a -P 26 clippy --workspace --all-targets --all-features -- -D warnings
