name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"
  ANDROID_NDK_VERSION: 29.0.14206865
  CACHE_SUFFIX: e # cache busting

jobs:
  lint:
    runs-on: ubuntu-latest
    # runtime is normally 10 seconds
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check for typos
        uses: crate-ci/typos@v1.50.1

      - name: Install tombi
        uses: tombi-toml/setup-tombi@v1.4

      - name: Check for tombi
        run: tombi lint --error-on-warnings; tombi format --check --diff

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal

      - name: Check rust formatting
        run: cargo fmt --all -- --check

  build:
    name: Build ${{matrix.os}}
    # runtime is normally 2 minutes
    timeout-minutes: 8
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # The snapshots live in the asset submodule. Without it the
      # `tests/snapshots` symlinks dangle, and a comparison against a missing
      # snapshot stores the frame and passes instead of comparing.
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy

      - name: Install Mesa
        # Linux runners have no GPU: lavapipe is the software Vulkan
        # implementation the GPU tests render through. macOS has Metal and
        # Windows has DX12, so neither needs anything installed.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # Without `unlit` this crate compiles down to its general facilities,
      # so the built-in pipeline stays something a caller could have written.
      - name: Clippy (no features)
        run: cargo clippy -p wgpu_unlit_render --no-default-features --all-targets -- -Dwarnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

      - name: Build ${{matrix.os}}
        run: cargo build --workspace --all-targets

      # `cargo xtask test` runs nextest over the unit and integration tests,
      # then `cargo test --doc` for the doctests nextest does not cover. The
      # same command a contributor runs, so CI cannot drift from it.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      - name: Install cargo-nextest
        run: cargo binstall --no-confirm cargo-nextest

      - name: Test ${{matrix.os}}
        run: cargo xtask test

      - name: Doc
        run: cargo doc --workspace --no-deps --document-private-items --keep-going
        env:
          RUSTDOCFLAGS: -D warnings

      # The example renders headlessly and compares the frame against its
      # The example renders every scene headlessly and compares each frame
      # against its stored snapshot, so a rendering regression fails here
      # rather than passing unnoticed. This is the check that replaced the
      # snapshot tests that used to live in `crates/unlit3d/tests`; the
      # scenes and their snapshots are described in `unlit3d_examples`.
      # `--update` regenerates the snapshots; review their diff before
      # committing it.
      - name: Compare the example's scenes against their snapshots
        run: >
          cargo run -p unlit3d_examples --features snapshot
          -- --headless --scene all

  build-wasm:
    name: Build wasm
    # runtime is normally 30 seconds
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy
          rustup target add wasm32-unknown-unknown

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-wasm-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -Dwarnings

      - name: Build wasm
        # Not `--all-targets`: the example crate is a `cdylib` as well as a
        # binary, and on `wasm32-unknown-unknown` both want to write
        # `unlit3d_examples.wasm`, which cargo warns about as an output
        # filename collision. The binary is what a browser runs; the library
        # exists for Android, so only the targets that never produce it are
        # built here.
        run: >
          cargo build --workspace --target wasm32-unknown-unknown
          --bins --tests --benches --examples

  build-android:
    name: Build android
    # A Gradle build downloads its own distribution and dependencies, and the
    # Rust cross-build walks the whole dependency tree; the caches make the
    # runs after the first much shorter.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal
          rustup target add aarch64-linux-android

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-android-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # AGP 9 requires JDK 17 or newer, and the runner image's default is not
      # guaranteed to be one the wrapper accepts.
      - name: Set up JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle user home — the distribution and the dependency
      # cache — through `actions/cache`, rather than the proprietary provider
      # this action defaults to.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      # The NDK is not installed here: the runner image already carries the
      # version this project pins, and `cargo ndk` finds it by itself.
      - name: Install cargo-ndk
        run: cargo binstall --no-confirm cargo-ndk

      # One command for both halves: `cargo ndk` builds the example's shared
      # library into the APK's `jniLibs` directory, then the task runs the
      # Gradle wrapper on `android/`. A debug APK is what is published because
      # it is the one the build signs: an unsigned release APK cannot be
      # installed without a signing step of its own.
      #
      # `ANDROID_HOME` comes from the runner image rather than this workflow's
      # `env`, so it is expanded by the shell: the `env` context only holds
      # variables a workflow sets, not the ones the runner inherits.
      - name: Build the APK
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          cargo xtask build-android

      - name: Upload the APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unlit3d-examples-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
