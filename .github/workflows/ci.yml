name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: "-C debuginfo=0 -D warnings"
  ANDROID_NDK_VERSION: 29.0.14206865
  CACHE_SUFFIX: e # cache busting

jobs:
  lint:
    runs-on: ubuntu-latest
    # runtime is normally 10 seconds
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check for typos
        uses: crate-ci/typos@v1.50.1

      - name: Install tombi
        uses: tombi-toml/setup-tombi@v1.4

      - name: Check for tombi
        run: tombi lint --error-on-warnings; tombi format --check --diff

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal

      - name: Check rust formatting
        run: cargo fmt --all -- --check

  build:
    name: Build ${{matrix.os}}
    # runtime is normally 2 minutes
    timeout-minutes: 8
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # Without `unlit` this crate compiles down to its general facilities,
      # so the built-in pipeline stays something a caller could have written.
      - name: Clippy (no features)
        run: cargo clippy -p wgpu_unlit_render --no-default-features --all-targets -- -Dwarnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -Dwarnings

      - name: Build ${{matrix.os}}
        run: cargo build --workspace --all-targets

      # `cargo xtask test` runs nextest over the unit and integration tests,
      # then `cargo test --doc` for the doctests nextest does not cover. The
      # same command a contributor runs, so CI cannot drift from it.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      - name: Install cargo-nextest
        run: cargo binstall --no-confirm cargo-nextest

      - name: Test ${{matrix.os}}
        run: cargo xtask test

      - name: Doc
        run: cargo doc --workspace --no-deps --document-private-items --keep-going
        env:
          RUSTDOCFLAGS: -D warnings

  snapshot:
    name: Snapshot the example
    # runtime is normally 1 minute
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # The snapshots live in the asset submodule, so this job checks it out.
      # Without it the snapshot path does not exist and every comparison
      # quietly stores instead of comparing, which is how a broken render
      # reaches `main`.
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal

      - name: Install Mesa
        # The runner has no GPU; lavapipe is the software Vulkan
        # implementation the example renders through.
        run: |
          sudo apt-get update
          sudo apt-get install --yes mesa-vulkan-drivers

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: snapshot-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      # The example renders headlessly and compares the frame against its
      # snapshot, so a rendering regression fails here rather than passing
      # unnoticed. `--update` regenerates the snapshot; review its diff before
      # committing it.
      - name: Compare the example against its snapshot
        run: >
          cargo run -p unlit3d_examples --features snapshot
          -- --headless --frames 30
          --snapshot wgpu_unlit_render_asset_files/snapshots/example.webp

  build-wasm:
    name: Build wasm
    # runtime is normally 30 seconds
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal --component clippy
          rustup target add wasm32-unknown-unknown

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-wasm-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features -- -Dwarnings

      - name: Build wasm
        run: cargo build --workspace --target wasm32-unknown-unknown --all-targets

  build-android:
    name: Build android
    # runtime is normally 30 seconds
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal
          rustup target add aarch64-linux-android

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-android-${{ matrix.os }}-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      - name: Install Android NDK
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'ndk;${{env.ANDROID_NDK_VERSION}}'

      - name: Install cargo-ndk
        run: cargo binstall --no-confirm cargo-ndk

      - name: Build
        run: >
          export ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${{env.ANDROID_NDK_VERSION}}
          && export ANDROID_NDK_ROOT=${ANDROID_NDK_HOME}
          && cargo ndk-env -t arm64-v8a
          && cargo ndk -t arm64-v8a -P 26 build

  # The example is published to Pages so the web build can be opened in a
  # browser: WebGPU is only available in a secure context, which `file://` is
  # not and the HTTPS Pages serves is. Neither job runs for a pull request or a
  # merge queue entry — a PR must not publish the site, and `build-wasm`
  # already compiles the crate for the target there. Publishing is split from
  # building so only the deploying job holds a token that may write the site.
  #
  # Pages has to be set to build from a workflow once, in the repository's
  # settings; `configure-pages` reads that setting, so until it is set this job
  # fails here rather than deploying.
  build-pages:
    name: Build the web example
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # runtime is normally 1 minute
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only reads the site it is about to publish to, but GitHub has no
      # narrower grant that `configure-pages` is known to accept.
      pages: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal
          rustup target add wasm32-unknown-unknown

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: build-pages-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      # `wasm-bindgen` reads the crate's metadata, so the CLI has to be the
      # same version the crate was compiled against. Neither `Cargo.lock` is
      # committed nor the version pinned here, so the build resolves the newest
      # crate and this installs the newest CLI; the two are released together
      # and so agree. Pinning one of them would be the bug: the other would
      # move ahead of it on the next release and the bindgen step would fail.
      - name: Install wasm-bindgen
        run: cargo binstall --no-confirm wasm-bindgen-cli

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      # The same pipeline a contributor runs locally: build for the target,
      # then let wasm-bindgen write the JS loader and the page beside it.
      # `--release` because this is what a visitor downloads, and the debug
      # binary is several times its size.
      - name: Build the web example
        run: cargo xtask run-wasm --release --no-serve

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: target/generated/release

  # Runs only once the site has been built and uploaded; a skipped build skips
  # this job with it, so the gate above covers both.
  deploy-pages:
    name: Deploy the web example
    needs: build-pages
    # runtime is normally 30 seconds
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # There is one Pages slot per repository, so deployments queue behind each
    # other; one already running is left to finish, since cancelling it would
    # leave the site half-published.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
