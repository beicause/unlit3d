name: Pages

# Publishing lives in its own workflow rather than in `ci.yml` because the two
# want different triggers and different tokens: this one publishes the site —
# the web examples with the workspace's API docs beside them — and therefore
# runs only where a site may be written, while `ci.yml` validates every pull
# request and must never publish.
#
# Pages has to be set to build from a workflow once, in the repository's
# settings. `configure-pages` reads that setting, so until it is set the build
# fails there rather than deploying.
on:
  workflow_dispatch:
  push:
    branches: ["main"]

# A pull request does not reach this workflow at all, so the sites a PR might
# produce never compete with the published one. Deployments still queue behind
# each other: there is one Pages slot per repository, and cancelling a
# deployment in progress would leave the site half-published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CACHE_SUFFIX: f # cache busting

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    # runtime is normally 2 minutes
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # The job builds for two targets: the browser, where the simd flag comes from
    # `.cargo/config.toml` and a `CARGO_TARGET_*` variable merges with that file,
    # and the host for the docs. Setting them per target is what keeps the host
    # compiler from reading a feature it does not have. The docs build does not
    # deny warnings, so its variable leaves that out.
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: "-C debuginfo=0 -D warnings"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C debuginfo=0"
    permissions:
      contents: read
      # Only reads the site it is about to publish to, but GitHub has no
      # narrower grant that `configure-pages` is known to accept.
      pages: write

    steps:
      - uses: actions/checkout@v7.0.1

      # The example embeds the glTF assets with `include_bytes!`, so the web
      # build needs the asset submodule. `.gitmodules` marks it `update = none`,
      # and `--checkout` is what gets past that setting, as in `ci.yml`.
      - name: Check out the asset submodule
        run: git submodule update --init --checkout

      # The demo's soundfont is a 14 MB asset the repository keeps out of
      # version control, and `asset_bytes` embeds it with `include_bytes!`.
      # Without it the build substitutes an empty stub, and what this step
      # publishes has no sound and no track controls at all — so the fetch is
      # what makes the page play, and `UNLIT3D_REQUIRE_SOUNDFONT` on the build
      # below is what keeps a checkout that lost the asset from publishing a
      # silent demo.
      - name: Fetch the demo soundfont
        run: |
          mkdir -p assets
          gh api -H "Accept: application/vnd.github.raw" repos/beicause/soundfont/contents/FluidR3Mono_GM.sf3 > assets/FluidR3Mono_GM.sf3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update --profile=minimal
          # The API docs are the one step that needs nightly; see its comment.
          rustup toolchain install nightly --no-self-update --profile=minimal
          rustup target add wasm32-unknown-unknown

      - name: Caching
        uses: Swatinem/rust-cache@v2
        with:
          key: pages-${{ env.CACHE_SUFFIX }}
          env-vars: ImageVersion
          cache-bin: false

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0

      # `wasm-bindgen` reads the crate's metadata, so the CLI has to be the
      # same version the crate was compiled against. Neither `Cargo.lock` is
      # committed nor the version pinned here, so the build resolves the newest
      # crate and this installs the newest CLI; the two are released together
      # and so agree. Pinning one of them would be the bug: the other would
      # move ahead of it on the next release and the bindgen step would fail.
      - name: Install wasm-bindgen
        run: cargo binstall --no-confirm wasm-bindgen-cli

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      # The same pipeline a contributor runs locally: build each example for
      # the target, then let wasm-bindgen write the JS loader and the page
      # beside it. The task builds every wasm under the workspace's `wasm-release`
      # profile, so this is what a visitor downloads: a smaller binary than
      # `--release` gives, and none of the debug size or compile time. It also
      # writes the landing page that links the examples and the docs.
      - name: Build the web examples
        run: cargo xtask run-wasm --no-serve
        env:
          UNLIT3D_REQUIRE_SOUNDFONT: "1"

      # `--all-features` below turns on the audio bridge, whose Linux backend
      # is built by `alsa-sys`; its build script needs ALSA's headers, which
      # the runner image does not carry. The same install is in `ci.yml` and in
      # `ci-main.yml`, both of which build the workspace's tests.
      - name: Install ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev

      # The API docs ship beside the examples, under `docs/`. Rustdoc writes the
      # page that lists the crates only with `--enable-index-page`, and the
      # crates' `doc(cfg(...))` labels appear only under `--cfg docsrs`; both are
      # nightly-only, so this is the one step that uses nightly. `--all-features`
      # shows the optional modules — glTF, reflection, UI and winit — rather than
      # the default set alone.
      #
      # Warnings are left alone here: a published page with a broken link is
      # worth more than a site that a doc warning holds back, and
      # `ci.yml` is where the same docs are built with `-D warnings` — on the
      # branch, before a merge rather than after it.
      - name: Build the API docs
        run: |
          cargo +nightly doc --workspace --no-deps --document-private-items --all-features --keep-going
          mkdir -p target/generated/wasm-release/docs
          cp -r target/doc/. target/generated/wasm-release/docs/
        env:
          RUSTDOCFLAGS: "--cfg docsrs -Z unstable-options --enable-index-page"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: target/generated/wasm-release

  deploy:
    name: Deploy the site
    needs: build
    # runtime is normally 30 seconds
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
