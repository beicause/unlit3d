[package]
name = "unlit_wgpu_test_util"
version = "0.1.0-dev.1"
edition.workspace = true
description = "The headless GPU test harness for the unlit3d workspace: device setup, buffer and texture readback, SSIMULACRA2 snapshot assertions."
repository.workspace = true
license.workspace = true
keywords = ["snapshot", "testing", "webgpu", "wgpu"]
publish = false

[dependencies]
glam.workspace = true
log.workspace = true
# Drives wgpu's asynchronous adapter and device requests. A browser cannot
# block on them, so the harness is asynchronous wherever it talks to wgpu.
pollster.workspace = true
# For `DeviceTier`/`DeviceCapabilities`: a test that narrows the device to
# WebGL2's shape has to record the capabilities that go with it, and they have
# to be the same type the renderer reads. This is a dev-dependency cycle
# (`unlit_wgpu` dev-depends on this crate for its own tests), which Cargo
# resolves by building `unlit_wgpu` without its dev-dependencies here.
unlit_wgpu = { path = "../unlit_wgpu" }
wgpu.workspace = true

[dependencies.image]
version = "0.25"
default-features = false
features = ["webp"]
optional = true

[dependencies.ssimulacra2]
version = "0.5"
default-features = false
optional = true

# The writing side of the harness. A browser has no filesystem to write a test
# result to, so its half of the harness reports through `sessionStorage`
# instead, and these pull in only what building a canvas and an export needs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The logger backend `init_logging` installs natively: `env_logger` reads
# `RUST_LOG`.
env_logger.workspace = true
# The native test runner, and the HTTP client the wasm proxy drives the browser
# with. Neither is reachable from a wasm build, whose tests run in a page.
libtest-mimic.workspace = true
ureq.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The logger backend `init_logging` installs on the web: `console_log` forwards
# to the browser console.
console_log.workspace = true
# A wasm build creates its adapter from a canvas, which needs the DOM, and
# publishes its result through an export the page calls.
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = {
  workspace = true,
  features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
  ]
}

[features]
snapshot = ["dep:image", "dep:ssimulacra2"]

[lints]
workspace = true
