[package]
name = "unlit3d_mcp"
version = "0.1.0-dev.1"
edition.workspace = true
description = "A Model Context Protocol server that drives a unlit3d world through its public API."
repository.workspace = true
license.workspace = true
publish = false

[lib]
name = "unlit3d_mcp"

[[bin]]
name = "unlit3d-mcp"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
base64.workspace = true
glam.workspace = true
image.workspace = true
pollster.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "rt", "sync", "time"] }
unlit_ecs = { path = "../unlit_ecs" }
unlit_wgpu = { path = "../unlit_wgpu", default-features = false, features = ["unlit"] }
unlit3d = { path = "../unlit3d", default-features = false, features = ["gltf", "reflect"] }
wgpu.workspace = true

[lints]
workspace = true
