[package]
name = "unlit3d_mcp"
version = "0.1.0-dev.2"
edition.workspace = true
description = "A Model Context Protocol server that drives a unlit3d world through its public API."
repository.workspace = true
license.workspace = true
# The integration test serves a real world over a pair of streams, so it needs
# a GPU; it is not part of what a consumer downloads.
exclude = ["/tests"]

[lib]
name = "unlit3d_mcp"

[dependencies]
async-channel.workspace = true
base64.workspace = true
# The world-information structs the original crates expose derive their own
# reflection, and facet-json turns that into the JSON this transport speaks.
facet.workspace = true
facet-json.workspace = true
glam.workspace = true
image.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }
unlit_ecs = { path = "../unlit_ecs", version = "0.1.0-dev.2", features = ["reflect"] }
unlit_wgpu = { path = "../unlit_wgpu", version = "0.1.0-dev.2", default-features = false, features = ["reflect", "unlit"] }
unlit3d = { path = "../unlit3d", version = "0.1.0-dev.2", default-features = false, features = ["gltf", "reflect"] }
uuid.workspace = true
wgpu.workspace = true

[dev-dependencies]
unlit_wgpu_test_util = { path = "../unlit_wgpu_test_util" }

[lints]
workspace = true
