[package]
name = "unlit_wgpu"
version = "0.1.0-dev.2"
edition.workspace = true
description = "A compact, opinionated WebGPU renderer for unlit draws: resource graph, vertex compression, pooled buffers and a declarative scene, with a built-in unlit pipeline and an egui backend."
repository.workspace = true
license.workspace = true
keywords = ["gamedev", "graphics", "rendering", "webgpu", "wgpu"]
# The integration tests build against `unlit_wgpu_test_util`, which is not
# published, and compare against snapshot baselines that live in the asset
# submodule; neither travels in a package, so the tests do not either. The
# README links its diagram by absolute URL, so the packaged copy would go
# unread.
exclude = ["/assets", "/tests"]
# The files under tests/ are modules of the one suite binary below rather than
# targets of their own; see its docs.
autotests = false

# One binary for the whole integration suite: both files link the same GPU stack,
# so a link per file would repeat that work. The unlit pipeline and the egui
# backend are both required, which is why the binary is skipped whole when the
# latter is off.
[[test]]
harness = false
name = "unlit_wgpu"
path = "tests/gpu_suite.rs"
required-features = ["egui", "unlit"]

[dependencies]
arrayvec.workspace = true
bitflags.workspace = true
const_shader_layout.workspace = true
egui = { workspace = true, optional = true }
facet = { workspace = true, features = ["reflect"], optional = true }
foldhash.workspace = true
glam.workspace = true
hashbrown.workspace = true
ringbuf.workspace = true
smallvec.workspace = true
wesl = { workspace = true, optional = true }
wesl-core.workspace = true
wgpu.workspace = true
zerocopy.workspace = true
zerocopy-derive.workspace = true

[dev-dependencies]
pollster.workspace = true
unlit_wgpu_test_util = { path = "../unlit_wgpu_test_util", features = ["snapshot"] }
wgpu = { version = "30.0.1", default-features = false, features = ["noop"] }

[build-dependencies]
wesl = { version = "0.5.0", default-features = false, features = ["package"] }

# The GPU tests drive the shared registry rather than libtest's generated
# harness, so one file serves both `cargo nextest` and the browser's wasm
# build. `wasm-bindgen` is what exports the page's entry point on the web.

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true

[features]
default = ["unlit"]
## An [egui](https://egui.rs) backend that draws tessellated egui output as
## ordinary screen-space draws. It draws with a built-in unlit pipeline, so
## it implies `unlit`.
egui = ["dep:egui", "unlit"]
## Reflection: derive [facet](https://docs.rs/facet) for the resource graph's
## information structures, so a bridge can serialise them as they are. Off by
## default because it is only the bridge that needs it; the renderer never
## reads the reflection.
reflect = ["dep:facet"]
## The built-in unlit pipeline: the shader variants it composes from the WESL
## package, its options, and its bind-group and vertex-buffer layouts.
##
## It is built on the core the same way a caller's own pipeline would be: it
## uses the binding and slot conventions, the vertex compression and the
## resource tracking the crate exposes to everyone, and composes the `unlit`
## module of the crate's WESL package with `wesl`. Without it the crate keeps
## those general facilities and drops everything specific to the built-in
## pipeline -- including the WESL compiler it composes shaders with.
unlit = ["dep:wesl"]

[lints]
workspace = true
