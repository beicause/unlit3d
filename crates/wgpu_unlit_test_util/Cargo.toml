[package]
name = "wgpu_unlit_test_util"
version = "0.1.0-dev.1"
edition.workspace = true
description = "The headless GPU test harness for the unlit3d workspace: device setup, buffer and texture readback, SSIMULACRA2 snapshot assertions."
repository.workspace = true
license.workspace = true
keywords = ["snapshot", "testing", "webgpu", "wgpu"]
publish = false

[dependencies]
glam.workspace = true
log.workspace = true
# Drives wgpu's async adapter/device requests from the synchronous harness.
pollster.workspace = true
wgpu = { workspace = true, default-features = false, features = ["dx12", "metal", "std", "vulkan", "web", "webgpu", "wgsl"] }

[dependencies.fast-ssim2]
version = "0.8"
default-features = false
optional = true

[dependencies.image]
version = "0.25"
default-features = false
features = ["webp"]
optional = true

# The logger backend `init_logging` installs: `env_logger` reads `RUST_LOG`
# natively, `console_log` forwards to the browser console on the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log.workspace = true

[features]
snapshot = ["dep:fast-ssim2", "dep:image"]

[lints]
workspace = true
