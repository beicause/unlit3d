[package]
name = "unlit3dx"
version = "0.1.0-dev.3"
edition.workspace = true
description = "Multi-world extension for unlit3d: physics, audio and gameplay worlds on their own threads, joined by jobs and snapshots."
repository.workspace = true
license.workspace = true
keywords = ["audio", "ecs", "gamedev", "multithreading", "physics"]
# The integration tests read their soundfont from the workspace's `assets`,
# which is not published, so the tests do not travel in a package either.
exclude = ["/tests"]
# The files under tests/ are modules of the one suite binary below rather than
# targets of their own; see its docs.
autotests = false

# docs.rs builds with the default features only, which would leave every
# feature-gated module out of the published documentation. All features is
# what puts them there; the docsrs cfg is what lets their `doc(cfg(...))`
# markers render the badge naming the feature.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# One binary for the whole integration suite: the files drive the same
# multi-world stack, so a link per file would repeat it. The required features
# are those the cases reach -- an audio world, its synthesis and a physics
# world -- so the binary is skipped whole while any of them is off. No case
# takes a GPU, so `render` is not required.
[[test]]
name = "unlit3dx"
path = "tests/suite.rs"
required-features = ["audio", "physics", "synth"]

[dependencies]
async-channel.workspace = true
base64 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
# The lossless encoder the audio tools write a captured mix with. Only the
# encoder itself is used: the parallel, serde and log features are its own
# plumbing, not something a one-shot file write needs.
flacenc = { workspace = true, default-features = false }
futures-executor.workspace = true
futures-util.workspace = true
glam.workspace = true
log.workspace = true
rapier3d = { workspace = true, optional = true }
ringbuf = { workspace = true, optional = true }
rustysynth-ext = { workspace = true, optional = true }
# The audio tools describe their JSON arguments and results to an MCP client.
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
unlit_ecs = { path = "../unlit_ecs", version = "0.1.0-dev.3", default-features = false }
unlit_wgpu = { path = "../unlit_wgpu", version = "0.1.0-dev.3", default-features = false, optional = true }
unlit3d = { path = "../unlit3d", version = "0.1.0-dev.3", default-features = false }
web-time.workspace = true
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
zerocopy.workspace = true
zerocopy-derive.workspace = true

[dev-dependencies]
# The encoder's tests decode the stream it wrote, so a stream that only its
# own writer can read fails here.
claxon.workspace = true
serde_json.workspace = true

# The host build's own pieces of the application skeleton: the platform
# logger, the command-line entry's blocking GPU open, and the PNG encoder a
# capture writes. A browser and an Android activity log and encode through
# their platform targets instead.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
env_logger = { workspace = true, optional = true }
image = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

# On this target cpal swaps its OS audio backends for the `wasm-bindgen` one,
# which drives a Web Audio context; every other dependency here is pure Rust
# and builds as-is.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true, optional = true }
console_log = { workspace = true, optional = true }
cpal = { workspace = true, features = ["wasm-bindgen"], optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

# The Android activity's logger, and the winit backend that builds its event
# loop, belong to the application skeleton's windowed run.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = { workspace = true, optional = true }

[features]
default = ["app", "audio", "physics", "render", "synth"]
## The application skeleton: the windowed, headless, interactive and MCP runs
## an `App` plugs its scene into, plus the command line and the capture's
## file output. Audio is what the runs mix; the scene's own features stay the
## application's to choose.
app = [
  "audio",
  "dep:android_logger",
  "dep:clap",
  "dep:console_error_panic_hook",
  "dep:console_log",
  "dep:env_logger",
  "dep:image",
  "dep:pollster",
  "render",
]
## The audio output thread, backed by cpal and a ring buffer.
audio = ["dep:cpal", "dep:ringbuf"]
## The MCP stdio server driven from the host world. Its audio tools record
## what a world fills, so it turns the audio feature on itself rather than
## leaving a caller to pair the two — the recorder is compiled only for them.
mcp = [
  "audio",
  "dep:base64",
  "dep:schemars",
  "dep:serde",
  "unlit_ecs/mcp",
  "unlit3d/mcp",
  "unlit3d/winit",
]
## The MCP streamable-HTTP server on a TCP port, driven from the host
## world: the same protocol stack as `mcp` plus the HTTP transport, with
## the run's `--mcp-http` switch serving the scene to network clients.
## Not built on wasm or Android, where there is no host to serve from.
mcp-http = [
  "mcp",
  "unlit_ecs/mcp-http",
]
## The physics world on its own thread, backed by rapier.
physics = ["dep:rapier3d"]
## The window-facing half: a GPU context and a presenter over a sub-world
## that draws into the swap chain or into an offscreen target.
render = [
  "dep:unlit_wgpu",
  "dep:wasm-bindgen-futures",
  "dep:wgpu",
  "dep:winit",
  "unlit3d/egui",
  "unlit3d/winit",
]
## Soundfont-backed `OnFill` sources for the audio world.
synth = ["audio", "dep:rustysynth-ext"]

[lints]
workspace = true
