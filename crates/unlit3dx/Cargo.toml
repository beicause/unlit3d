[package]
name = "unlit3dx"
version = "0.1.0-dev.3"
edition.workspace = true
description = "Multi-world extension for unlit3d: physics, audio and gameplay worlds on their own threads, joined by jobs and snapshots."
repository.workspace = true
license.workspace = true
keywords = ["audio", "ecs", "gamedev", "multithreading", "physics"]
# The integration tests read their soundfont from the workspace's `assets`,
# which is not published, so the tests do not travel in a package either.
exclude = ["/tests"]
# The files under tests/ are modules of the one suite binary below rather than
# targets of their own; see its docs.
autotests = false

# One binary for the whole integration suite: the files drive the same
# multi-world stack, so a link per file would repeat it. The required features
# are those the cases reach -- an audio world, its synthesis and a physics
# world -- so the binary is skipped whole while any of them is off. No case
# takes a GPU, so `render` is not required.
[[test]]
name = "unlit3dx"
path = "tests/suite.rs"
required-features = ["audio", "physics", "synth"]

[dependencies]
async-channel.workspace = true
base64 = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
futures-executor.workspace = true
futures-util.workspace = true
# The lossless encoder the audio tools write a captured mix with. Only the
# encoder itself is used: the parallel, serde and log features are its own
# plumbing, not something a one-shot file write needs.
flacenc = { workspace = true, default-features = false }
glam.workspace = true
log.workspace = true
rapier3d = { workspace = true, optional = true }
ringbuf = { workspace = true, optional = true }
rustysynth-ext = { workspace = true, optional = true }
# The audio tools describe their JSON arguments and results to an MCP client.
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
unlit_ecs = { path = "../unlit_ecs", version = "0.1.0-dev.3" }
unlit_wgpu = { path = "../unlit_wgpu", version = "0.1.0-dev.3", default-features = false, features = ["unlit"], optional = true }
unlit3d = { path = "../unlit3d", version = "0.1.0-dev.3", default-features = false }
web-time.workspace = true
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[dev-dependencies]
# The encoder's tests decode the stream it wrote, so a stream that only its
# own writer can read fails here.
claxon.workspace = true
serde_json.workspace = true

# On this target cpal swaps its OS audio backends for the `wasm-bindgen` one,
# which drives a Web Audio context; every other dependency here is pure Rust
# and builds as-is.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"], optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[features]
default = ["audio", "physics", "render", "synth"]
## The audio output thread, backed by cpal and a ring buffer.
audio = ["dep:cpal", "dep:ringbuf"]
## The MCP stdio server driven from the host world. Its audio tools record
## what a world fills, so it turns the audio feature on itself rather than
## leaving a caller to pair the two — the recorder is compiled only for them.
mcp = [
  "audio",
  "dep:base64",
  "dep:schemars",
  "dep:serde",
  "unlit_ecs/mcp",
  "unlit3d/mcp",
  "unlit3d/winit",
]
## The physics world on its own thread, backed by rapier.
physics = ["dep:rapier3d"]
## The window-facing half: a GPU context and a presenter over a sub-world
## that draws into the swap chain or into an offscreen target.
render = [
  "dep:unlit_wgpu",
  "dep:wasm-bindgen-futures",
  "dep:wgpu",
  "dep:winit",
  "unlit3d/ui",
  "unlit3d/winit",
]
## Soundfont-backed `OnFill` sources for the audio world.
synth = ["audio", "dep:rustysynth-ext"]

[lints]
workspace = true
