[package]
name = "unlit_ecs"
version = "0.1.0-dev.2"
edition.workspace = true
description = "A compact archetype ECS: immutable archetypes, cell-based components, behaviour components instead of systems."
repository.workspace = true
license.workspace = true
keywords = ["archetype", "ecs", "gamedev"]
# The files under tests/ are modules of the one suite binary below rather than
# targets of their own; see its docs.
autotests = false

[[test]]
name = "unlit_ecs"
path = "tests/suite.rs"

[dependencies]
# Reflection is what a bridge serialises these structures through; the ECS
# itself never reads it, so it is off by default. The unconditional
# dependencies stay few: a hash map behind one trait and the access errors.
facet = { workspace = true, features = ["reflect"], optional = true }
facet-format = { workspace = true, optional = true }
facet-json = { workspace = true, optional = true }
hashbrown.workspace = true
inventory = { workspace = true, optional = true }
thiserror.workspace = true

# The MCP server speaks the protocol over a native stdio pipe through rmcp and
# tokio. A browser drives the world directly, so on wasm these stay out of the
# build entirely, even under --all-features.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-channel = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[features]
## The [mcp](crate::mcp) module: the Model Context Protocol server, its transport
## and the ECS tools it answers with. Pulls in the protocol stack (rmcp, tokio)
## and implies `reflect`, whose registry is the codec those tools use. Not built
## on wasm, where a browser drives the world directly.
mcp = [
  "dep:async-channel",
  "dep:rmcp",
  "dep:schemars",
  "dep:serde",
  "dep:serde_json",
  "dep:tokio",
  "dep:uuid",
  "reflect",
]
## Derive [facet](https://docs.rs/facet) for the [`info`](crate::WorldInfo)
## structures and provide the [`reflect`](crate::reflect) registry, whose
## link-time table of submitted entries turns a component's reflection into the
## codec a JSON bridge addresses components by. Off by default: nothing in the
## ECS reads it, and it is the only feature that pulls in a dependency besides
## the hasher.
reflect = ["dep:facet", "dep:facet-format", "dep:facet-json", "dep:inventory"]

[lints]
workspace = true
