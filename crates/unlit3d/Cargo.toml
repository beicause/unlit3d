[package]
name = "unlit3d"
version = "0.1.0-dev.1"
edition.workspace = true
description = "The high-level WebGPU rendering API over unlit_wgpu and unlit_ecs: ECS components, frame sources, input, UI and winit presentation."
repository.workspace = true
license.workspace = true
keywords = ["ecs", "gamedev", "rendering", "webgpu", "wgpu"]
# The integration tests build against `unlit_wgpu_test_util`, which is not
# published, so the tests do not travel in a package either.
exclude = ["/tests"]

[[test]]
harness = false
name = "custom_instances"

[[test]]
harness = false
name = "custom_pipeline"

[[test]]
harness = false
name = "gltf_scene"
required-features = ["gltf"]

[[test]]
harness = false
name = "gpu_ecs"

[[test]]
harness = false
name = "gpu_ui_source"
required-features = ["ui"]

[[test]]
harness = false
name = "letterbox"

[[test]]
harness = false
name = "morphed_scene"

[[test]]
harness = false
name = "skinned_scene"

[dependencies]
arrayvec.workspace = true
bitflags.workspace = true
const_shader_layout.workspace = true
egui = { workspace = true, optional = true }
glam.workspace = true
gltf = { workspace = true, optional = true }
half = { workspace = true, optional = true }
hashbrown.workspace = true
log.workspace = true
profiling.workspace = true
smallvec.workspace = true
unlit_ecs = { path = "../unlit_ecs", version = "0.1.0-dev.1" }
unlit_wgpu = { path = "../unlit_wgpu", version = "0.1.0-dev.1", default-features = false, features = ["unlit"] }
web-time = { workspace = true, optional = true }
wesl.workspace = true
wesl-core.workspace = true
wgpu.workspace = true
winit = { workspace = true, optional = true }
zerocopy.workspace = true
zerocopy-derive.workspace = true

[dev-dependencies]
unlit_wgpu_test_util = { path = "../unlit_wgpu_test_util", features = ["snapshot"] }
wgpu = { workspace = true, features = ["noop"] }

# The GPU tests drive the shared registry rather than libtest's generated
# harness, so one file serves both `cargo nextest` and the browser's wasm
# build. `wasm-bindgen` is what exports the page's entry point on the web.

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true

[features]
default = ["ui", "winit"]
## Load glTF documents and patch them into another world's [`MeshSource`] with
## the [`gltf`](crate::gltf) module: upload textures, materials and meshes into
## an existing resource graph, unload them again, and spawn entities that draw
## the document's default scene.
gltf = ["dep:gltf", "dep:half"]
## The [`ui`](crate::ui) module: an egui overlay drawn as a frame source, and
## the [`unlit_wgpu`] egui backend it draws with. The UI's frame clock
## is the one place that needs a browser-capable `Instant`.
ui = ["dep:egui", "dep:web-time", "unlit_wgpu/egui"]
## Integration with [winit](https://docs.rs/winit): the [`winit`](crate::winit)
## module, which presents a [`Renderer`](crate::Renderer) into a window's swap
## chain.
winit = ["dep:winit"]

[lints]
workspace = true
