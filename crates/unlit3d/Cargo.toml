[package]
name = "unlit3d"
version = "0.1.0-dev.2"
edition.workspace = true
description = "The high-level WebGPU rendering API over unlit_wgpu and unlit_ecs: ECS components, frame sources, input, UI and winit presentation."
repository.workspace = true
license.workspace = true
keywords = ["ecs", "gamedev", "rendering", "webgpu", "wgpu"]
# The integration tests build against `unlit_wgpu_test_util`, which is not
# published, so the tests do not travel in a package either.
exclude = ["/tests"]

[[test]]
harness = false
name = "blit"

[[test]]
harness = false
name = "custom_instances"

[[test]]
harness = false
name = "custom_pipeline"

[[test]]
harness = false
name = "gltf_scene"
required-features = ["gltf"]

[[test]]
harness = false
name = "gpu_ecs"

[[test]]
harness = false
name = "gpu_ui_source"
required-features = ["ui"]

[[test]]
harness = false
name = "letterbox"

[[test]]
harness = false
name = "morphed_scene"

[[test]]
harness = false
name = "passes"

[[test]]
harness = false
name = "skinned_scene"

[[test]]
harness = false
name = "mcp_server"
required-features = ["mcp"]

[dependencies]
arc-swap.workspace = true
arrayvec.workspace = true
# One unbounded channel per input subscriber: a world that reads input at its
# own pace is exactly a channel consumer.
async-channel.workspace = true
bitflags.workspace = true
const_shader_layout.workspace = true
egui = { workspace = true, optional = true }
facet = { workspace = true, features = ["reflect"], optional = true }
facet-json = { workspace = true, optional = true }
glam.workspace = true
gltf = { workspace = true, optional = true }
half = { workspace = true, optional = true }
hashbrown.workspace = true
inventory = { workspace = true, optional = true }
log.workspace = true
profiling.workspace = true
unlit_ecs = { path = "../unlit_ecs", version = "0.1.0-dev.2" }
unlit_wgpu = { path = "../unlit_wgpu", version = "0.1.0-dev.2", default-features = false, features = ["unlit"] }
web-time = { workspace = true, optional = true }
wesl.workspace = true
wgpu.workspace = true
winit = { workspace = true, optional = true }
zerocopy.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
unlit_wgpu_test_util = { path = "../unlit_wgpu_test_util", features = ["snapshot"] }
wgpu = { workspace = true, features = ["noop"] }

# The GPU tests drive the shared registry rather than libtest's generated
# harness, so one file serves both `cargo nextest` and the browser's wasm
# build. `wasm-bindgen` is what exports the page's entry point on the web.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only the MCP tools encode pixels or write files; a browser build never does.
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen.workspace = true

[features]
default = ["ui", "winit"]
## Load glTF documents and patch them into another world's [`MeshSource`] with
## the [`gltf`](crate::gltf) module: upload textures, materials and meshes into
## an existing resource graph, unload them again, and spawn entities that draw
## the document's default scene.
gltf = ["dep:gltf", "dep:half"]
## The [mcp](crate::mcp) module: the rendering tools a world answers through the
## Model Context Protocol server defined by [unlit_ecs]. Implies `reflect`,
## whose registry is the codec those tools use, and `gltf`, so the load_gltf tool
## has a loader. Not built on wasm, where a browser drives the world directly.
mcp = [
  "dep:base64",
  "dep:image",
  "gltf",
  "reflect",
  "unlit_ecs/mcp",
  "unlit_wgpu/reflect",
]
## Reflection: derive [facet](https://docs.rs/facet) for the components whose
## fields cross a JSON boundary, so a component's own field list is the only
## place those fields are written down, plus the [reflect] module, whose
## link-time table of submitted entries turns that reflection into a codec. Off
## by default because it is only the bridge that needs it; the engine itself
## never reads the reflection.
reflect = ["dep:facet", "dep:facet-json", "dep:inventory", "unlit_ecs/reflect"]
## The [`ui`](crate::ui) module: an egui overlay drawn as a frame source, and
## the [`unlit_wgpu`] egui backend it draws with. The UI's frame clock
## is the one place that needs a browser-capable `Instant`.
ui = ["dep:egui", "dep:web-time", "unlit_wgpu/egui"]
## Integration with [winit](https://docs.rs/winit): the [`winit`](crate::winit)
## module, which presents a [`Renderer`](crate::Renderer) into a window's swap
## chain.
winit = ["dep:winit"]

[lints]
workspace = true
