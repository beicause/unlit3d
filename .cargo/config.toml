[alias]
xtask = "run -p xtask --"

[profile.dev]
debug = 1

# Every wasm build of this repository enables `simd128`: every browser that
# runs WebAssembly also runs fixed-width SIMD, and rapier's physics and
# rustysynth's mixing both vectorize under it. The `RUSTFLAGS` environment
# variable, which the CI workflows set, overrides this whole section — the
# workflows that build for this target therefore add the same flag to their
# `RUSTFLAGS` themselves, and the two paths must stay identical.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
