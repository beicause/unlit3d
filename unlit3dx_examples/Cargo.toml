[package]
name = "unlit3dx_examples"
version = "0.1.0-dev.3"
edition.workspace = true
description = "A multi-world unlit3dx example: rendering, physics and soundfont audio in one scene."
repository.workspace = true
license.workspace = true
keywords = ["audio", "example", "gamedev", "physics", "webgpu"]
publish = false
# The suite's modules sit under tests/ beside the suite itself, so cargo
# must not take each of them for a target of its own.
autotests = false

# The library is what the binary and the Android shared library both link
# against. That shared library is a crate of its own
# (`unlit3dx_examples_android`): `crate-type` is the same for every target, so a
# `cdylib` here would link a shared library on the desktop and in the browser
# too, where nothing loads one.
[lib]
crate-type = ["rlib"]
name = "unlit3dx_examples"

[[bin]]
name = "unlit3dx-examples"
path = "src/main.rs"

# The snapshot tests step the same worlds the windowed binary runs, so the
# page the wasm suite loads is a test target rather than the binary. One target
# holds them all, the way every other crate's suite does: they share the
# harness, and each target of its own would link the GPU stack again.
[[test]]
harness = false
name = "unlit3dx_examples"
path = "tests/gpu_suite.rs"

[dependencies]
argh.workspace = true
glam.workspace = true
hashbrown.workspace = true
log.workspace = true
unlit_ecs = { path = "../crates/unlit_ecs", version = "0.1.0-dev.3" }
unlit_wgpu = { path = "../crates/unlit_wgpu", version = "0.1.0-dev.3", default-features = false, features = ["unlit"] }
unlit3d = { path = "../crates/unlit3d", version = "0.1.0-dev.3", default-features = false, features = ["ui", "winit"] }
unlit3dx = { path = "../crates/unlit3dx", version = "0.1.0-dev.3" }
# The soundfont the demo embeds. Its own crate because the bytes are fourteen
# megabytes: a constant holding them would copy them into this crate's own
# metadata and slow every downstream rebuild.
unlit3dx_asset_bytes = { path = "asset_bytes", version = "0.1.0-dev.3" }
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
# The tests build a `Scene` without spawning a world, so they need the
# queue a `JobSender` wraps themselves.
async-channel.workspace = true
base64.workspace = true
serde_json.workspace = true
# The headless run's snapshot tests compare captured frames and audio
# against baselines kept in the asset submodule.
unlit_wgpu_test_util = { path = "../crates/unlit_wgpu_test_util", version = "0.1.0-dev.3", features = ["snapshot"] }

# The logger backend, which differs by platform even though there is only one
# per target: `env_logger` writes to the terminal a command line runs in.
# `--mcp` serves the worlds over the Model Context Protocol, which needs a
# terminal's standard input and output; neither a browser nor an Android
# activity has one.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
env_logger.workspace = true
# The library's `mcp` feature wraps the Model Context Protocol server the
# demo serves with --mcp.
unlit3dx = { path = "../crates/unlit3dx", version = "0.1.0-dev.3", features = ["mcp"] }

# The headless mode encodes its last frame as a PNG on the way out.
image = { workspace = true, default-features = false, features = ["png"] }
# The interactive headless host describes its own tools to MCP, which needs a
# JSON schema and a deserializer for each tool's arguments.
schemars.workspace = true
serde.workspace = true

# The GPU request runs off the main thread: `pollster` drives it on a worker
# thread on native, and the browser's task queue drives it on the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The recording a test reads back is a FLAC stream, so it decodes one to
# assert on the samples.
claxon.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser has no terminal: the web build logs to the console and
# reports panics there.
console_error_panic_hook.workspace = true
console_log.workspace = true
wasm-bindgen-futures.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The export the test page calls is what `gpu_test_main!` generates.
wasm-bindgen.workspace = true

# Winit needs one of its Android activity backends selected to build for
# Android, and the choice belongs to whoever starts the event loop. Picking it
# here rather than passing a feature means a plain Android build works; a
# feature would have to be turned on by every caller. `GameActivity` supports
# the wider range of Android versions.
#
# There is no terminal behind an activity, so the logger backend is logcat.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
winit = { workspace = true, features = ["android-game-activity"] }

[lints]
workspace = true
