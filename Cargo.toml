[package]
name = "bevy_unlit"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[dependencies]
bevy = { version = "0.20.0-rc.1", default-features = false, features = ["bevy_log", "bevy_window", "std"] }
const_shader_layout = { version = "0.4.2", default-features = false, features = ["derive", "glam", "std"] }
wesl = { version = "0.5.0" }
wgpu = { version = "30.0.1", features = ["dx12", "metal", "std", "vulkan", "web", "webgpu", "wgsl"] }
zerocopy = { version = "0.8.56", default-features = false, features = ["alloc", "std"] }
zerocopy-derive = { version = "0.8.56", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.0-rc.1", default-features = false, features = ["web"] }

[features]
android-game-activity = ["bevy/android-game-activity"]
android-native-activity = ["bevy/android-native-activity"]
wayland = ["bevy/wayland"]
x11 = ["bevy/x11"]
