[workspace]
resolver = "3"
members = [
  "crates/*",
  "unlit3d_benchmarks",
  "unlit3d_cli",
  "unlit3d_examples",
  "unlit3d_examples_android",
  "unlit3dx_examples",
  "unlit3dx_examples_android",
  "xtask",
]

[workspace.package]
edition = "2024"
repository = "https://github.com/beicause/unlit3d"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The drawing interface a document is painted through: blitz-paint records
# shapes into it and a backend rasterizes them. Only the interface is used, since
# no backend of its own fits a frame source.
anyrender = { version = "0.14.0", default-features = false }
# The snapshot mailbox's slot: a producer swaps the newest snapshot in without
# taking a lock a reader holds.
arc-swap = { version = "1.9.2", default-features = false }
argh = "0.1.19"
arrayvec = { version = "0.7.8", default-features = false, features = ["std"] }
async-channel = { version = "2.5.0", default-features = false, features = ["std"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bitflags = { version = "2.13.2", default-features = false, features = ["std"] }
# The HTML document Blitz lays out and paints. The three are pinned to one
# release because they require each other exactly; the default feature set is
# spelled out instead of taken, since it turns the host's system fonts on.
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["accessibility", "custom-widget", "file-input", "svg", "text-transform-icu", "woff"] }
blitz-html = { version = "=0.3.0-beta.4", default-features = false }
blitz-paint = { version = "=0.3.0-beta.4", default-features = false, features = ["svg"] }
# The viewport and colour-scheme types a document is configured through.
blitz-traits = { version = "=0.3.0-beta.4", default-features = false }
# The FLAC decoder a test reads a stream back with, so an encoder is
# checked against something other than itself.
claxon = "0.4.3"
console_error_panic_hook = { version = "0.1.7", default-features = false }
console_log = "1.1.0"
const_shader_layout = { version = "0.5.1", default-features = false, features = ["derive", "glam_033", "std"] }
# Real-time audio output. `cpal` opens the device's stream; the lock-free
# ring buffer bridges the audio thread that fills it and the stream's
# callback that drains it.
cpal = { version = "0.18.2", default-features = false }
# Decodes the inline images a page carries as `data:` URLs. Nothing else reads
# one: a page is served bytes by path, and this is the one scheme it decodes
# itself.
data-url = { version = "0.3.2", default-features = false, features = ["std"] }
# The glTF loader decompresses KHR_draco_mesh_compression primitives with
# this bitstream decoder. Only the decoder direction is built; the encoder is
# a dev dependency for the tests that synthesise streams in memory.
draco-core = { version = "2.3.3", default-features = false, features = ["decoder", "edgebreaker_valence_decode", "legacy_bitstream_decode", "point_cloud_decode"] }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts", "bytemuck"] }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
# The font egui's default text is drawn with, which is also the font a Blitz
# document is laid out with: a page paints the glyphs the crate carries rather
# than the host's, so one snapshot holds across machines.
epaint_default_fonts = { version = "0.37.0", default-features = false }
# Reflection: a component's own field list is its codec, so nothing declares
# those fields twice. `facet` derives the reflection, `facet-json` turns it
# into the JSON the MCP transport speaks. Optional: only `unlit3d`'s
# `reflect` feature pulls it in.
facet = { version = "0.50.0-rc.7", default-features = false, features = ["std"] }
# The error types the JSON bridge answers with. `facet-json` re-exports only
# its deserializer error, so the serializer error comes from the format crate
# underneath it.
facet-format = { version = "0.50.0-rc.7", default-features = false }
facet-json = { version = "0.50.0-rc.7", default-features = false }
# Resamples the glTF textures' mip chain. Its std feature is the whole point:
# the crate is no_std by default and only the std build has the buffers a
# resize needs. No image or bytemuck integration — the pixels come from the
# decoder as bytes, and go back the same way.
fast_image_resize = { version = "6.1.0", default-features = false, features = ["std"] }
# The FLAC encoder the audio tools write a recorded mix with. Only the
# encoder itself is used: the parallel, serde and log features are its own
# plumbing, not something a one-shot file write needs.
flacenc = { version = "0.5.1", default-features = false }
# Hashbrown uses this as its hasher, so hashing through it matches how the
# crate's hash tables hash; its `FixedState` seeds deterministically, which a
# per-instance hasher does not.
foldhash = { version = "0.2.0", default-features = false }
# The single-threaded executor a world drives its own tasks with. Only its std
# pool is used: the optional thread-pool feature would add a thread pool to a
# crate whose worlds already own their threads.
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }
# The spawn extension trait a local pool is used through. std implies alloc,
# which is what the trait needs.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
glam = { version = "0.33", default-features = false, features = ["std", "zerocopy"] }
# The glyph runs a page's text is drawn as. `vello_gpu` shapes them but keeps
# `glifo`, the crate the glyphs come from, out of its own exports, so the
# adapter that hands it glyphs names them itself.
glifo = { version = "0.5.0", default-features = false, features = ["std"] }
gltf = { version = "1.4.1", default-features = false, features = ["extensions", "import", "names", "utils"] }
half = { version = "2.7.1", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = ["default"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Components are registered by submitting an entry to a link-time table, so a
# crate that defines its own components registers them without a call into
# anything: the entries are collected from wherever they are written.
inventory = { version = "0.3", default-features = false }
# The key names and modifiers a Blitz event states. blitz-traits takes them in
# its own public signatures but does not re-export them, so the crate that hands
# a page an event names them itself; it is pinned to the version underneath.
keyboard-types = { version = "0.8.0", default-features = false, features = ["std"] }
# The native half of the wasm test harness: `libtest-mimic` runs the shared
# registry as a libtest-compatible binary, and `ureq` is the HTTP client the
# proxy sends each test to the browser's runner with.
libtest-mimic = "0.8.2"
log = { version = "0.4", default-features = false, features = ["alloc", "std"] }
# The font collection a page is laid out with. `blitz-dom` re-exports only the
# `FontContext` it builds, so the crate that registers more than one font builds
# the collection itself; the two crates are pinned to the version underneath.
parley = { version = "0.12.0", default-features = false, features = ["std"] }
pollster = { version = "1.0.1", default-features = false }
profiling = { version = "1.0.18", default-features = false }
# Property tests: the arithmetic that has no obvious example case — bin
# rounding, allocation churn, topological order — is driven by generated
# inputs, and a failure shrinks to the smallest one. Only `std` is needed; the
# fork and timeout defaults would pull in a process-forking harness.
proptest = { version = "1.11", default-features = false, features = ["std"] }
# The physics world. No parallel feature: the physics world owns its thread,
# so the rayon pool and the scheduler plumbing it pulls in are not needed.
rapier3d = { version = "0.36.1", default-features = false, features = ["dim3", "f32", "std"] }
# The Model Context Protocol server. `server` provides the handler and the
# stdio loop, `transport-io` is the stdio transport, and `macros` derives the
# tool router from `#[tool]` methods.
ringbuf = { version = "0.6.0", default-features = false, features = ["std"] }
rmcp = { version = "3.5.1", default-features = false, features = ["macros", "server", "transport-io"] }
# The synthesizer the audio world renders notes through. The `sf3` feature
# reads the compressed FluidR3 sound bank the example plays through.
rustysynth-ext = { version = "1.5.0", default-features = false, features = ["sf3"] }
schemars = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
smallvec = { version = "1.16.1", default-features = false, features = ["const_generics", "const_new", "union"] }
# Derives the access errors an entity lookup answers with. Each variant carries
# the handle it was asked about, so a caller reads its own misuse back.
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
tokio = { version = "1.53", default-features = false }
ureq = { version = "3.4.0", default-features = false }
# The base URL a page's relative references resolve against, and the parse error
# `BlitzDocument::set_base_url` answers with. `blitz-traits` re-exports the `Url`
# type but not the error it parses with.
url = { version = "2.5", default-features = false, features = ["std"] }
uuid = { version = "1.26.1", default-features = false, features = ["v4"] }
# The GPU rasterizer those drawings reach: it records the page into the frame's
# own encoder. Its default features would drag in `wgpu/default`, which this
# workspace builds without, and the shader features are the ones a page uses —
# blurred shadows, every image kind and sweep gradients.
vello_gpu = { version = "0.4.0", default-features = false, features = ["all_shader_features", "text", "wgpu"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
# The browser APIs the web build reaches directly — fullscreen and screen
# orientation. Each crate selects the features it needs.
web-sys = { version = "0.3.105", default-features = false }
# `std::time::Instant` panics on `wasm32-unknown-unknown`; this reads the
# browser's clock there and re-exports `std::time` on every other target.
web-time = { version = "1.1.0", default-features = false }
# Opening a URL the overlay asked for: one call covers the desktop, Android and the
# browser, so the example keeps no platform branch of its own for it.
webbrowser = "1.2.4"
wesl = { version = "0.6.0", default-features = false }
wesl-core = { version = "0.1.0", default-features = false }
wgpu = { version = "30.0.0", default-features = false, features = ["dx12", "gles", "metal", "std", "vulkan", "webgl", "webgpu", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["default"] }
zerocopy = { version = "0.8.56", default-features = false, features = ["alloc", "std"] }
zerocopy-derive = { version = "0.8.56", default-features = false }

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# A module lives in a file named after it, so its path says which file to open
# without a directory listing in the middle. `mod.rs` is rejected.
mod_module_files = "deny"
print_stderr = "warn"
print_stdout = "warn"
# A glob import hides which names a file depends on, so a rename or a new
# sibling has to be traced through every glob rather than through the one
# import that names it. Doc comments that teach the prelude still write
# `use unlit3d::prelude::*`, and a unit test still pulls its own module in
# wholesale: the lint exempts both, a prelude by its last path segment and a
# `cfg(test)` module's `super` import by the module it sits in.
wildcard_imports = "deny"

[workspace.lints.rust]
missing_docs = "deny"

[profile.dev]
opt-level = "s"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
