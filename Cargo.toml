[workspace]
resolver = "3"
members = ["crates/*", "unlit3d_benchmarks", "unlit3d_cli", "unlit3d_examples", "unlit3dx_examples", "xtask"]

[workspace.package]
edition = "2024"
repository = "https://github.com/beicause/unlit3d"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
argh = "0.1.19"
arrayvec = { version = "0.7.8", default-features = false, features = ["std"] }
async-channel = { version = "2.5.0", default-features = false, features = ["std"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
bitflags = { version = "2.13.2", default-features = false, features = ["std"] }
# The FLAC decoder the snapshot tests read their audio baseline with.
claxon = "0.4.3"
console_error_panic_hook = { version = "0.1.7", default-features = false }
console_log = "1.1.0"
const_shader_layout = { version = "0.4.2", default-features = false, features = ["derive", "glam", "std"] }
# Real-time audio output. `cpal` opens the device's stream; the lock-free
# ring buffer bridges the audio thread that fills it and the stream's
# callback that drains it.
cpal = { version = "0.18.2", default-features = false }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts", "bytemuck"] }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
# Reflection: a component's own field list is its codec, so nothing declares
# those fields twice. `facet` derives the reflection, `facet-json` turns it
# into the JSON the MCP transport speaks. Optional: only `unlit3d`'s
# `reflect` feature pulls it in.
facet = { version = "0.50.0-rc.7", default-features = false, features = ["std"] }
facet-json = { version = "0.50.0-rc.7", default-features = false }
# The FLAC encoder the headless run writes its audio deliverable with. Only
# the encoder itself is used: the parallel, serde and log features are its own
# plumbing, not something a one-shot file write needs.
flacenc = { version = "0.5.1", default-features = false }
# Hashbrown uses this as its hasher, so hashing through it matches how the
# crate's hash tables hash; its `FixedState` seeds deterministically, which a
# per-instance hasher does not.
foldhash = { version = "0.2.0", default-features = false }
# The single-threaded executor that drives a batch of awaited requests. Only
# its std pool is used: the optional thread-pool feature would add a thread
# pool to a crate whose worlds already own their threads.
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }
# The join combinator those requests are batched with. std implies alloc,
# which is what try_join_all and the spawn extension trait need.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
glam = { version = "0.33", default-features = false, features = ["std", "zerocopy"] }
gltf = { version = "1.4.1", default-features = false, features = ["import", "names", "utils"] }
half = { version = "2.7.1", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = ["default"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Components are registered by submitting an entry to a link-time table, so a
# crate that defines its own components registers them without a call into
# anything: the entries are collected from wherever they are written.
inventory = { version = "0.3", default-features = false }
# The native half of the wasm test harness: `libtest-mimic` runs the shared
# registry as a libtest-compatible binary, and `ureq` is the HTTP client the
# proxy sends each test to the browser's runner with.
libtest-mimic = "0.8.2"
log = { version = "0.4", default-features = false, features = ["alloc", "std"] }
pollster = { version = "1.0.1", default-features = false }
profiling = { version = "1.0.18", default-features = false }
# The physics world. No parallel feature: the physics world owns its thread,
# so the rayon pool and the scheduler plumbing it pulls in are not needed.
rapier3d = { version = "0.36.1", default-features = false, features = ["dim3", "f32", "std"] }
# The Model Context Protocol server. `server` provides the handler and the
# stdio loop, `transport-io` is the stdio transport, and `macros` derives the
# tool router from `#[tool]` methods.
ringbuf = { version = "0.5.3", default-features = false, features = ["std"] }
rmcp = { version = "3.5.1", default-features = false, features = ["macros", "server", "transport-io"] }
# The synthesizer the audio world renders notes through. The `sf3` feature
# reads the compressed FluidR3 sound bank the example plays through.
rustysynth-ext = { version = "1.5.0-alpha.1", default-features = false, features = ["sf3"] }
schemars = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
smallvec = { version = "1.16.1", default-features = false, features = ["const_generics", "const_new", "union"] }
tokio = { version = "1.53", default-features = false }
ureq = { version = "3.4.0", default-features = false }
uuid = { version = "1.26.1", default-features = false, features = ["v4"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
# The browser APIs the web build reaches directly — fullscreen and screen
# orientation. Each crate selects the features it needs.
web-sys = { version = "0.3.105", default-features = false }
# `std::time::Instant` panics on `wasm32-unknown-unknown`; this reads the
# browser's clock there and re-exports `std::time` on every other target.
web-time = { version = "1.1.0", default-features = false }
# Opening a URL the UI asked for: one call covers the desktop, Android and the
# browser, so the example keeps no platform branch of its own for it.
webbrowser = "1.2.4"
wesl = { version = "0.5.0", default-features = false }
wesl-core = { version = "0.1.0", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "gles", "metal", "std", "vulkan", "web", "webgl", "webgpu", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["default"] }
zerocopy = { version = "0.8.56", default-features = false, features = ["alloc", "std"] }
zerocopy-derive = { version = "0.8.56", default-features = false }

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
print_stderr = "warn"
print_stdout = "warn"

[workspace.lints.rust]
missing_docs = "deny"

[profile.dev]
opt-level = 1

[profile.wasm-dev]
inherits = "release"
opt-level = "s"
