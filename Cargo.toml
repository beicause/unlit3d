[workspace]
resolver = "3"
members = ["crates/*", "unlit3d_examples"]
# Not a member: `cargo xtask` reaches it through the alias in
# `.cargo/config.toml`, so the task runner's own dependencies never weigh on
# the workspace the tasks act on.
exclude = ["xtask"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
arrayvec = { version = "0.7.8", default-features = false, features = ["std"] }
async-channel = { version = "2.5.0", default-features = false, features = ["std"] }
bitflags = { version = "2.13.2", default-features = false, features = ["std"] }
console_error_panic_hook = { version = "0.1.7", default-features = false }
console_log = "1.1.0"
const_shader_layout = { version = "0.4.2", default-features = false, features = ["derive", "glam", "std"] }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts", "bytemuck"] }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
glam = { version = "0.33", default-features = false, features = ["std", "zerocopy"] }
hashbrown = { version = "0.17.1", default-features = false, features = ["default"] }
log = { version = "0.4", default-features = false, features = ["alloc", "std"] }
petgraph = { version = "0.8.3", default-features = false, features = ["graphmap", "matrix_graph", "stable_graph", "std"] }
pollster = { version = "0.4.0", default-features = false }
smallvec = { version = "1.16.1", default-features = false, features = ["const_generics", "const_new", "union"] }
wasm-bindgen-futures = "0.4.78"
# `std::time::Instant` panics on `wasm32-unknown-unknown`; this reads the
# browser's clock there and re-exports `std::time` on every other target.
web-time = { version = "1.1.0", default-features = false }
wesl = { version = "0.5.0", default-features = false }
wesl-core = { version = "0.1.0", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "metal", "std", "vulkan", "web", "webgpu", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["default"] }
zerocopy = { version = "0.8.56", default-features = false, features = ["alloc", "std"] }
zerocopy-derive = { version = "0.8.56", default-features = false }

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
print_stderr = "warn"
print_stdout = "warn"
