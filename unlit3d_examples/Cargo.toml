[package]
name = "unlit3d_examples"
version = "0.1.0-dev.1"
edition.workspace = true
description = "A windowed unlit3d example with selectable scenes, and the snapshot tests that compare them."
repository.workspace = true
license.workspace = true
keywords = ["example", "gamedev", "webgpu", "wgpu"]
publish = false

# The windowed example is a library as well as a binary: the binary is the
# command line every desktop and web build runs, and the library is what the
# Android build packages — the activity loads the shared library and calls into
# it. `rlib` is what the binary links against, `cdylib` is what Android loads.
[lib]
crate-type = ["cdylib", "rlib"]
name = "unlit3d_examples"

[[bin]]
name = "unlit3d-examples"
path = "src/main.rs"

[[test]]
harness = false
name = "gpu_scenes"

[[test]]
harness = false
name = "selector_position"

[dependencies]
argh.workspace = true
glam.workspace = true
log.workspace = true
unlit_wgpu = { path = "../crates/unlit_wgpu", version = "0.1.0-dev.1", default-features = false, features = ["unlit"] }
unlit3d = { path = "../crates/unlit3d", version = "0.1.0-dev.1", features = ["gltf"] }
web-time.workspace = true
wgpu.workspace = true
winit.workspace = true

# The snapshot tests drive the example's own scenes through the harness, so they
# read frames back and compare them with the same code the crates' GPU tests use,
# rather than a copy. Nothing in the library reaches the harness itself, so it is
# a test dependency and not a dependency of the example.
[dev-dependencies]
unlit_wgpu_test_util = { path = "../crates/unlit_wgpu_test_util", features = ["snapshot"] }

# The logger backend, which differs by platform even though there is only one
# per target: `env_logger` writes to the terminal a command line runs in.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
env_logger.workspace = true

# The GPU context is requested asynchronously, so the setup future needs a
# driver: a blocking executor natively, the browser's task queue on the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The logger backend and panic hook forward to the browser console.
console_error_panic_hook.workspace = true
console_log.workspace = true
# The browser's fullscreen and screen-orientation APIs, with the bindings that
# reach them.
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = {
  workspace = true,
  features = [
    # Reading whether the page may take a canvas fullscreen, and whether it is
    # in it now, is what decides if the button is drawn and what it says.
    "Document",
    "OrientationLockType",
    "OrientationType",
    "Screen",
    "ScreenOrientation",
    "Window",
  ]
}

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The export the test page calls is what `gpu_test_main!` generates.
wasm-bindgen.workspace = true

# Winit needs one of its Android activity backends selected to build for
# Android, and the choice belongs to whoever starts the event loop. Picking it
# here rather than passing a feature means a plain Android build works; a
# feature would have to be turned on by every caller. `GameActivity` supports
# the wider range of Android versions.
#
# There is no terminal behind an activity, so the logger backend is logcat.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
winit = { workspace = true, features = ["android-game-activity"] }

[lints]
workspace = true
