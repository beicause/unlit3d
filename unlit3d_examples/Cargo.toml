[package]
name = "unlit3d_examples"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
glam.workspace = true
log.workspace = true
unlit3d = { path = "../crates/unlit3d" }
wgpu.workspace = true
wgpu_unlit_render = { path = "../crates/wgpu_unlit_render", version = "0.1.0", default-features = false, features = ["unlit"] }
winit.workspace = true

# The GPU context is requested asynchronously, so the setup future needs a
# driver: a blocking executor natively, the browser's task queue on the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The logger backend: `env_logger` reads `RUST_LOG` natively.
env_logger.workspace = true
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The logger backend and panic hook forward to the browser console.
console_error_panic_hook.workspace = true
console_log.workspace = true
wasm-bindgen-futures.workspace = true

[lints]
workspace = true
