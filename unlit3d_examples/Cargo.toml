[package]
name = "unlit3d_examples"
version = "0.1.0-dev.3"
edition.workspace = true
description = "A windowed unlit3d example with selectable scenes, and the snapshot tests that compare them."
repository.workspace = true
license.workspace = true
keywords = ["example", "gamedev", "webgpu", "wgpu"]
publish = false
# The files under tests/ are modules of the one suite binary below rather than
# targets of their own; see its docs.
autotests = false

# The binary is the command line every desktop and web build runs; the library
# is what that binary links against, and what the Android shared library links
# against in turn. That shared library is a crate of its own
# (`unlit3d_examples_android`): `crate-type` is the same for every target, so a
# `cdylib` here would link a shared library on the desktop and in the browser
# too, where nothing loads one.
[lib]
crate-type = ["rlib"]
name = "unlit3d_examples"

[[bin]]
name = "unlit3d-examples"
path = "src/main.rs"

# One binary for the whole integration suite: both files link the same GPU
# stack, so a link per file would repeat that work.
[[test]]
harness = false
name = "unlit3d_examples"
path = "tests/gpu_suite.rs"

[dependencies]
argh.workspace = true
# The scene that owns a pipeline lays its uniform blocks out against WGSL's
# alignment rules, so it declares the layout the same way the engine does.
const_shader_layout.workspace = true
glam.workspace = true
log.workspace = true
# The GPU-info panel reads the device's facts from their serde description
# rather than a hand-written field list; see limit_rows.
serde_json.workspace = true
# The MCP command types the `--mcp` mode carries come from the ECS crate.
unlit_ecs = { path = "../crates/unlit_ecs", version = "0.1.0-dev.3", features = ["mcp"] }
unlit_wgpu = { path = "../crates/unlit_wgpu", version = "0.1.0-dev.3", default-features = false, features = ["lit"] }
unlit3d = { path = "../crates/unlit3d", version = "0.1.0-dev.3", features = ["gltf"] }
# The glTF documents the scenes embed. Their own crate because the bytes would
# otherwise sit in this crate's metadata, copied for every crate that reads it.
unlit3d_asset_bytes = { path = "asset_bytes", version = "0.1.0-dev.3" }
web-time.workspace = true
# A URL the UI asks to open is opened by this one call on every platform.
webbrowser.workspace = true
# The GPU-info panel reads the device's limits from their serde description,
# so this is the one crate that needs wgpu to serialise them. Static DXC links
# the DX12 shader compiler into the binary, so a Windows build compiles its
# shaders with the compiler it was tested against rather than with whatever
# the machine happens to have installed.
wgpu = { workspace = true, features = ["serde", "static-dxc"] }
winit.workspace = true
# A caller-owned instance record and uniform block are written as bytes, which
# is what these two describe and derive.
zerocopy.workspace = true
zerocopy-derive.workspace = true

# The snapshot tests drive the example's own scenes through the harness, so they
# read frames back and compare them with the same code the crates' GPU tests use,
# rather than a copy. Nothing in the library reaches the harness itself, so it is
# a test dependency and not a dependency of the example.
[dev-dependencies]
unlit_wgpu_test_util = { path = "../crates/unlit_wgpu_test_util", features = ["snapshot"] }

# The logger backend, which differs by platform even though there is only one
# per target: `env_logger` writes to the terminal a command line runs in.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
env_logger.workspace = true
# `--mcp` serves the scene over the Model Context Protocol, which needs a
# terminal's standard input and output; neither a browser nor an Android
# activity has one.
unlit3d = { path = "../crates/unlit3d", version = "0.1.0-dev.3", features = ["gltf", "mcp"] }

# The GPU context is requested asynchronously, so the setup future needs a
# driver: a blocking executor natively, the browser's task queue on the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The logger backend and panic hook forward to the browser console.
console_error_panic_hook.workspace = true
console_log.workspace = true
# The browser's fullscreen and screen-orientation APIs, with the bindings that
# reach them.
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = {
  workspace = true,
  features = [
    # Reading whether the page may take a canvas fullscreen, and whether it is
    # in it now, is what decides if the button is drawn and what it says.
    "Document",
    "OrientationLockType",
    "OrientationType",
    "Screen",
    "ScreenOrientation",
    "Window",
  ]
}

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The export the test page calls is what `gpu_test_main!` generates.
wasm-bindgen.workspace = true

# Winit needs one of its Android activity backends selected to build for
# Android, and the choice belongs to whoever starts the event loop. Picking it
# here rather than passing a feature means a plain Android build works; a
# feature would have to be turned on by every caller. `GameActivity` supports
# the wider range of Android versions.
#
# There is no terminal behind an activity, so the logger backend is logcat.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
winit = { workspace = true, features = ["android-game-activity"] }

[lints]
workspace = true
